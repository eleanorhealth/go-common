name: Update Go dependencies

on:
  schedule:
    - cron: "0 12 * * 1" # Monday 12:00 UTC
  workflow_dispatch:

concurrency:
  group: update-dependencies-go
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GOPRIVATE: github.com/eleanorhealth/*

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # Full history needed so git diff against origin/main works in create-pr
          fetch-depth: 0

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod

      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/eleanorhealth".insteadOf "https://github.com/eleanorhealth"

      - uses: eleanorhealth/actions/update-go@update-go/v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # license key expires per version; update manually when renewed
          pinned-deps: github.com/unidoc/unipdf/v3
